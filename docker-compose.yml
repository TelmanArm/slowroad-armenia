services:
  db:
    image: postgres:16
    container_name: slowroad-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: slowroad
    ports:
      - "5432:5432"
    volumes:
      - "/Users/telman/Slow Road/postgresql/data:/var/lib/postgresql/data"
    restart: unless-stopped