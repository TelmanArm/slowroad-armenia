- name: Set up SlowRoad server
  hosts: all
  become: true     

  tasks:
    - name: Start Docker
      ansible.builtin.service:
        name: docker
        state: started
    
    - name: Install nginx
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: Install certbot
      ansible.builtin.dnf:
        name: 
          - certbot
          - python3-certbot-nginx
        state: present
    
    - name: Start and enable nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Configure nginx proxy for app
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/slowroad.conf
        mode: "0644"
        content: |
          server {
              listen 80 default_server;
              server_name slowroadarmenia.com www.slowroadarmenia.com;

              location / {
                  return 301 https://$host$request_uri;
              }
          }
      notify: Reload nginx
      
    - name: Apply nginx changes now
      ansible.builtin.meta: flush_handlers
      
    - name: Get Let's Encrypt certificate
      ansible.builtin.command: >
        certbot certonly --nginx
        -d slowroadarmenia.com -d www.slowroadarmenia.com
        --non-interactive --agree-tos
        -m tgurgenyan@gmail.com
      args:
        creates: /etc/letsencrypt/live/slowroadarmenia.com/fullchain.pem 

    - name: Configure nginx HTTPS
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/slowroad-ssl.conf
        mode: "0644"
        content: |
          server {
              listen 443 ssl;
              server_name slowroadarmenia.com www.slowroadarmenia.com;

              ssl_certificate     /etc/letsencrypt/live/slowroadarmenia.com/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/slowroadarmenia.com/privkey.pem;

              location / {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
      notify: Reload nginx
      
    - name: Enable certbot auto-renewal
        ansible.builtin.service:
          name: certbot-renew.timer
          state: started
          enabled: true  
    
    - name: Create app folder
      ansible.builtin.file:
        path: /opt/slowroad
        state: directory
        owner: "{{ ansible_user }}"
        mode: "0755"

    - name: Write .env for docker compose
      ansible.builtin.copy:
        dest: /opt/slowroad/.env
        owner: "{{ ansible_user }}"
        mode: "0600"
        content: |
          POSTGRES_USER={{ lookup('env', 'POSTGRES_USER') }}
          POSTGRES_PASSWORD={{ lookup('env', 'POSTGRES_PASSWORD') }}
          POSTGRES_DB={{ lookup('env', 'POSTGRES_DB') }}
          ConnectionStrings__Default=Host=db;Database={{ lookup('env', 'POSTGRES_DB') }};Username={{ lookup('env', 'POSTGRES_USER') }};Password={{ lookup('env', 'POSTGRES_PASSWORD') }}
          Admin__Email={{ lookup('env', 'ADMIN_EMAIL') }}
          Admin__Password={{ lookup('env', 'ADMIN_PASSWORD') }}
          BACKUP_BUCKET={{ lookup('env', 'BACKUP_BUCKET') }}
      no_log: true

  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
