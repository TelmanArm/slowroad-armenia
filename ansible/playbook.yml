- name: Set up SlowRoad server
  hosts: all
  become: true     

  tasks:
    - name: Install Docker
      ansible.builtin.dnf:
        name: docker
        state: present

    - name: Create Docker CLI plugins folder
      ansible.builtin.file:
        path: /usr/local/lib/docker/cli-plugins
        state: directory
        mode: "0755"

    - name: Install Docker Compose plugin
      ansible.builtin.get_url:
        url: https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64
        dest: /usr/local/lib/docker/cli-plugins/docker-compose
        mode: "0755"

    - name: Start Docker and run it on boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Let the SSH user run docker without sudo
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Create app folder
      ansible.builtin.file:
        path: /opt/slowroad
        state: directory
        owner: "{{ ansible_user }}"
        mode: "0755"

    - name: Write .env for docker compose
      ansible.builtin.copy:
        dest: /opt/slowroad/.env
        owner: "{{ ansible_user }}"
        mode: "0600"
        content: |
          POSTGRES_USER={{ lookup('env', 'POSTGRES_USER') }}
          POSTGRES_PASSWORD={{ lookup('env', 'POSTGRES_PASSWORD') }}
          POSTGRES_DB={{ lookup('env', 'POSTGRES_DB') }}
          ConnectionStrings__Default=Host=db;Database={{ lookup('env', 'POSTGRES_DB') }};Username={{ lookup('env', 'POSTGRES_USER') }};Password={{ lookup('env', 'POSTGRES_PASSWORD') }}
          Admin__Email={{ lookup('env', 'ADMIN_EMAIL') }}
          Admin__Password={{ lookup('env', 'ADMIN_PASSWORD') }}
          BACKUP_BUCKET={{ lookup('env', 'BACKUP_BUCKET') }}
      no_log: true
