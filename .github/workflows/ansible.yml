name: Ansible

on:
  workflow_call:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  ansible:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Read EC2 host from SSM
        id: ssm
        run: |
          HOST=$(aws ssm get-parameter --name /slowroad/dev/ec2_host \
                 --query Parameter.Value --output text)
          echo "host=$HOST" >> "$GITHUB_OUTPUT"

      - name: Save SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > ansible/key.pem
          chmod 600 ansible/key.pem

      - run: pipx install ansible-core

      - name: Run playbook
        working-directory: ansible
        env:
          EC2_HOST: ${{ steps.ssm.outputs.host }}
          EC2_USER: ${{ secrets.EC2_USER }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
        run: ansible-playbook playbook.yml
