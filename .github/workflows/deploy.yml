name: Depoy to EC2

on:
  workflow_run: 
    workflows: [Build and push image]
    types: [completed]
    
jobs: 
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: SSH into EC2 adn updat the container
        uses: appleboy/ssh-action@v1
        with: 
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}                               
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ghcr.io/telmanarm/slowroad-armenia:latest
            
            docker stop slowroad || true                                  
            docker rm slowroad || true
            
            docker run -d --name slowroad --restart unless-stopped -p 80:8080 ghcr.io/telmanarm/slowroad-armenia:latest
            
            docker image prune -f