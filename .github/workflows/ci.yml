on:
  pull_request: 
    branches: [main]
  push:
    branches: [main]
    
jobs: 
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # Download all NuGet packages first
      - name: Restore
        run: dotnet restore

      # Compile the code (fails fast if it does not build)
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Run all tests, reusing the build above
      - name: Run tests
        run: dotnet test --no-build --configuration Release
    