name: Main

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: main
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      packer: ${{ steps.filter.outputs.packer }}
      infra: ${{ steps.filter.outputs.infra }}
      ansible: ${{ steps.filter.outputs.ansible }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Manual runs have no before-SHA, so pin the base explicitly.
          base: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}
          filters: |
            packer: ['packer/**']
            infra:  ['infra/**']
            ansible: ['ansible/**']
            app: ['SlowRoad/**', 'SlowRoad.Tests/**', 'SlowRoad.sln', 'Dockerfile', 'deploy/**']

  packer:
    needs: changes
    if: needs.changes.outputs.packer == 'true'
    uses: ./.github/workflows/packer.yml
    secrets: inherit

  terraform:
    needs: [changes, packer]
    if: ${{ !failure() && !cancelled() && (needs.changes.outputs.packer == 'true' || needs.changes.outputs.infra == 'true') }}
    uses: ./.github/workflows/terraform.yml
    secrets: inherit

  ansible:
    needs: [changes, terraform]
    if: ${{ !failure() && !cancelled() && (needs.changes.outputs.packer == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.ansible == 'true') }}
    uses: ./.github/workflows/ansible.yml
    secrets: inherit

  # Deploy when app code changed, or when ansible ran (new/rebuilt server needs the app).
  cd:
    needs: [changes, ansible]
    if: ${{ !failure() && !cancelled() && (needs.changes.outputs.app == 'true' || needs.ansible.result == 'success') }}
    uses: ./.github/workflows/cd.yml
    secrets: inherit
